name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Run a script
      env:
        SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
      run: echo "SLACK_API_TOKEN=${{ secrets.SLACK_API_TOKEN }}"
